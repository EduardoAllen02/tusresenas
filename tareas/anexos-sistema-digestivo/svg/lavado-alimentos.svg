<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Lavado de alimentos: frutas y verduras bajo el chorro de la llave en la tarja</title>

  <!-- marco ovalado -->
  <ellipse cx="120" cy="105" rx="111" ry="96" stroke-width="3"/>

  <!-- chorro de agua -->
  <path d="M132,78 C130,84 134,88 132,94 C130,100 134,105 131,110 L129,120 L147,120 L145,110 C148,105 144,100 146,94 C148,88 144,84 144,78 Z"/>

  <!-- llave (grifo) -->
  <path d="M192,142 L192,58 A30,30 0 0 0 132,58 L132,68 L129,68 L129,80 L147,80 L147,68 L144,68 L144,58 A18,18 0 0 1 180,58 L180,142 Z"/>
  <rect x="194" y="122" width="22" height="11" rx="5.5" transform="rotate(-20 194 127)"/>
  <rect x="177" y="126" width="18" height="14" rx="3"/>

  <!-- platano -->
  <g transform="translate(70,96) rotate(-6)">
    <path d="M29.5,-16.6 L32,-26.6 L41,-24.4 L38.5,-14.4 Z"/>
    <path d="M-38,-14 C-22,20 16,22 33,-9 L37,-22 C13,-2 -20,-4 -38,-14 Z"/>
  </g>

  <!-- sandia (rebanada) -->
  <g transform="translate(62,114) rotate(-12)">
    <path d="M-29,0 A29,29 0 0 0 29,0 Z"/>
    <path d="M-17,0 A17,17 0 0 0 17,0 Z"/>
    <ellipse cx="-8" cy="5" rx="1.6" ry="3" fill="#000" stroke-width="2" transform="rotate(20 -8 5)"/>
    <ellipse cx="0" cy="9" rx="1.6" ry="3" fill="#000" stroke-width="2"/>
    <ellipse cx="8" cy="5" rx="1.6" ry="3" fill="#000" stroke-width="2" transform="rotate(-20 8 5)"/>
  </g>

  <!-- jitomate -->
  <g transform="translate(158,124)">
    <ellipse rx="16" ry="14"/>
    <path d="M0,-12 C-3,-19 -13,-21 -18,-15 C-13,-9 -5,-8 0,-12 Z"/>
    <path d="M0,-12 C3,-19 13,-21 18,-15 C13,-9 5,-8 0,-12 Z"/>
    <path d="M0,-12 L0,-19"/>
  </g>

  <!-- uvas -->
  <g transform="translate(92,119)">
    <circle cx="-13" cy="-12" r="8"/>
    <circle cx="0" cy="-12" r="8"/>
    <circle cx="13" cy="-12" r="8"/>
    <circle cx="-6.5" cy="0" r="8"/>
    <circle cx="6.5" cy="0" r="8"/>
    <circle cx="0" cy="12" r="8"/>
    <path d="M0,-18 L-1,-26"/>
  </g>

  <!-- manzana -->
  <g transform="translate(126,121)">
    <path d="M0,-11 C-6,-19 -20,-17 -20,-1 C-20,13 -11,22 -2,19 C0,18.5 0,18.5 2,19 C11,22 20,13 20,-1 C20,-17 6,-19 0,-11 Z"/>
    <path d="M0,-11 C-1,-16 -3,-20 -5,-23"/>
    <path d="M-5,-17 C-8,-28 -21,-29 -26,-23 C-21,-15 -11,-13 -5,-17 Z"/>
  </g>

  <!-- gotas de salpicadura -->
  <path d="M154,80 C157,85 160,88 160,92 A6,6 0 0 1 148,92 C148,88 151,85 154,80 Z" transform="rotate(18 154 92)"/>
  <path d="M168,60 C170,64 173,67 173,70 A5,5 0 0 1 163,70 C163,67 166,64 168,60 Z" transform="rotate(18 168 70)"/>

  <!-- burbujas -->
  <circle cx="52" cy="64" r="10"/>
  <circle cx="73" cy="48" r="8"/>
  <circle cx="93" cy="37" r="6.5"/>
  <circle cx="112" cy="46" r="6"/>

  <!-- borde de la tarja -->
  <rect x="32" y="140" width="176" height="12" rx="6"/>
  <path d="M46,152 L56,170 Q60,178 72,178 L168,178 Q180,178 184,170 L194,152 Z"/>
